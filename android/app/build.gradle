plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gpsverify.lookup'
    compileSdk 34

    defaultConfig {
        applicationId "com.gpsverify.lookup"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["en"]
    }

    // Release signing. The keystore and its properties file live OUTSIDE the
    // public repository on purpose: publishing the signing key would let
    // anyone ship an "update" that Android would happily install over this
    // app on every handset.
    def ksPropsFile = rootProject.file("keystore.properties")
    def hasKeystore = ksPropsFile.exists()
    if (hasKeystore) {
        def ksProps = new Properties()
        ksProps.load(new FileInputStream(ksPropsFile))
        signingConfigs {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
}
